<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>repo ของฉัน</title>
</head>
<body>
    <h1>repo ของฉัน</h1>

    <!-- 1) แก้ href ให้เป็นลิงก์ repo ของคุณ (คัดลอกจากแถบที่อยู่ของ browser) -->
    <p><a id="repo" href="https://github.com/somchai-dev/PHP_9920">repo ของฉันบน GitHub</a></p>

    <!-- 2) prompt ที่ใช้ทดสอบว่า ChatGPT มองเห็น repo -->
    <p id="test-prompt">ช่วยอ่าน repo นี้ https://github.com/somchai-dev/PHP_9920 แล้วบอกว่ามีโฟลเดอร์อะไรบ้างที่ชื่อขึ้นต้นด้วย Lesson</p>

    <!-- 3) คำตอบของ ChatGPT (คัดลอกมาบางส่วน — ต้องมีชื่อโฟลเดอร์ Lesson) -->
    <p id="test-answer">ใน repo นี้มีโฟลเดอร์ Lesson01, Lesson02 และ Lesson03 ซึ่งเก็บโค้ดของแต่ละบทเรียนไว้</p>
</body>
</html>
