<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เครื่องคิด BMI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 560px;">
        <a href="../index.html" class="btn btn-outline-secondary btn-sm mb-3">← กลับหน้าแรก</a>

        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3 card-title mb-4">เครื่องคิด BMI</h1>

                <div class="mb-3">
                    <label for="weight" class="form-label">น้ำหนัก (กก.)</label>
                    <input id="weight" class="form-control" inputmode="decimal">
                </div>
                <div class="mb-3">
                    <label for="height" class="form-label">ส่วนสูง (ซม.)</label>
                    <input id="height" class="form-control" inputmode="decimal">
                </div>

                <button id="calc" class="btn btn-primary">คำนวณ</button>
                <p id="result" class="mt-3 mb-0 fw-semibold"></p>
            </div>
        </div>

        <nav class="d-flex justify-content-between mt-4">
            <a href="ex2.html" class="btn btn-outline-primary">← บทก่อนหน้า</a>
            <a href="ex4.html" class="btn btn-outline-primary">บทถัดไป →</a>
        </nav>
    </div>

    <script>
        // เมื่อกดปุ่ม: อ่านค่า → คำนวณ → แสดงผลใน #result
        document.getElementById("calc").addEventListener("click", function () {
            const weight = Number(document.getElementById("weight").value);
            const height = Number(document.getElementById("height").value) / 100; // แปลงเป็นเมตร
            const bmi = weight / (height * height);
            let bmitext = "";
            if(bmi<18.5){
                bmitext="น้ำหนักน้อย";
            }else if(bmi<25){
                bmitext="ปกติ";
            }else {
                bmitext="น้ำหนักเกิน";
            }
            if(isNaN(bmi) || weight <= 0 || height <= 0){
                document.getElementById("result").textContent = "กรุณากรอกน้ำหนักและส่วนสูง";
            } else {
                document.getElementById("result").textContent = "BMI " + bmi.toFixed(1) + " (" + bmitext + ")";
            }
        });
    </script>
</body>
</html>
