<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คำนวณราคาสินค้า</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--ink:#252943;--muted:#69718a;--paper:#f7f6f1;--yellow:#ffda55;--blue:#b9def6;--coral:#ff9b88;--mint:#bce8cf;--purple:#d9c8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px;color:var(--ink);font-family:Prompt,sans-serif;background:radial-gradient(#d9d7ce 1px,transparent 1px) 0 0/20px 20px,var(--paper)}.wrap{width:min(900px,100%);margin:auto}.top,footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 22px;font-size:13px}.back,.btn,button{display:inline-block;padding:10px 14px;background:white;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);text-decoration:none;color:var(--ink);font:600 14px Prompt;cursor:pointer}.hero,.panel{padding:28px;margin-bottom:20px;border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);background:white}.hero{background:var(--blue)}.tag{display:inline-block;padding:6px 11px;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;font-size:11px;font-weight:700}.hero h1{font:700 38px Kanit;margin:12px 0 5px}.hero p,.muted{color:var(--muted);font-size:14px;line-height:1.8}.field{display:grid;gap:6px;margin:12px 0}label{font-size:13px;font-weight:600}input,textarea,select{width:100%;padding:12px;border:2px solid #d9dbe3;border-radius:10px;font:14px Prompt}button{background:var(--yellow);margin-top:8px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border:1px solid #ddd}th{background:var(--yellow)}tbody tr:nth-child(even){background:#f4f0ff}footer{margin-top:24px;color:var(--muted)}@media(max-width:600px){body{padding:16px}.hero,.panel{padding:20px}.top{align-items:flex-start}footer{flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><b>✦ PHP_7030 · FLAT DESIGN</b><a class="back" href="index.html">← กลับ Lesson 2</a></header><section class="hero"><span class="tag">LESSON 03 · EXERCISE 2</span><h1>คำนวณราคาสินค้า</h1><p>ทดลองเปลี่ยนจำนวนสินค้า แล้วดูราคารวมด้วย JavaScript</p></section><section class="panel"><div style="text-align:center;margin:4px 0 22px"><img src="https://images.unsplash.com/photo-1513558161293-cdadhb1cf640?w=900&q=85" alt="แก้วเครื่องดื่มชาเย็น" style="width:min(100%,360px);height:230px;object-fit:cover;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--purple)"></div><p>ราคาต่อแก้ว <b><span id="price">45</span> บาท</b></p><div class="field"><label for="qty">จำนวนแก้ว</label><input id="qty" type="number" min="1" value="3"></div><p id="total" style="padding:16px;background:var(--mint);border:2px solid var(--ink);border-radius:12px;font-weight:700">รวม 135 บาท</p><button id="recalc">คำนวณใหม่</button></section><script>function calculate(){const price=Number(document.getElementById("price").textContent);const qty=Number(document.getElementById("qty").value);document.getElementById("total").textContent=qty>0?"รวม "+price*qty+" บาท":"กรุณากรอกจำนวนสินค้าให้ถูกต้อง";}document.getElementById("qty").addEventListener("input",calculate);document.getElementById("recalc").addEventListener("click",calculate);</script><nav class="lesson-navigation" aria-label="นำทางบทเรียน" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin:24px 0;padding:16px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink)"><a href="ex1.html" style="display:inline-block;padding:10px 15px;background:#d9c8f5;border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700">← หน้าก่อนหน้า</a><a href="ex3.html" style="display:inline-block;padding:10px 15px;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700">บทเรียนถัดไป →</a></nav><footer><span>PHP_7030 · Lesson 3 · แบบฝึกหัด 2</span><span>Learn · Practice · Build Better</span></footer></main></body></html>
