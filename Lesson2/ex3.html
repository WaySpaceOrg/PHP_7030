<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="แบบฟอร์มจองโต๊ะร้านอาหาร"><title>จองโต๊ะ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#252943;--muted:#69718a;--paper:#f7f6f1;--yellow:#ffda55;--blue:#b9def6;--coral:#ff9b88;--mint:#bce8cf;--purple:#d9c8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px;color:var(--ink);font-family:Prompt,sans-serif;background-color:var(--paper);background-image:radial-gradient(#d9d7ce 1px,transparent 1px);background-size:20px 20px}.wrap{width:min(920px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;font-size:13px;font-weight:600}.brand{display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink)}a{color:inherit}.back,.linkbtn{display:inline-block;padding:9px 13px;background:white;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);text-decoration:none;font-size:13px;font-weight:600}.back:hover,.linkbtn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.hero{padding:30px clamp(22px,5vw,44px);margin-bottom:20px;background:var(--blue);border:3px solid var(--ink);border-radius:23px;box-shadow:7px 7px 0 var(--ink)}.tag{display:inline-block;padding:6px 11px;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;font-size:11px;font-weight:700;letter-spacing:1px}.hero h1{margin:12px 0 5px;font:700 clamp(28px,5vw,42px)/1.2 Kanit,sans-serif}.hero p{margin:0;color:#46516e;font-size:14px;line-height:1.8}.panel{padding:clamp(20px,4vw,34px);background:white;border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink)}h2{font:600 22px Kanit;margin:0 0 16px}.muted{color:var(--muted)}.btn,button{display:inline-block;padding:12px 19px;border:2px solid var(--ink);border-radius:11px;background:var(--yellow);color:var(--ink);box-shadow:4px 4px 0 var(--ink);font:600 14px Prompt,sans-serif;cursor:pointer;transition:.15s}.btn:hover,button:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}input,select,textarea{width:100%;padding:12px 13px;border:2px solid #d9dbe3;border-radius:10px;background:#fffdf8;color:var(--ink);font:14px Prompt,sans-serif}input:focus,select:focus,textarea:focus{outline:3px solid #ffda5577;border-color:var(--ink)}label{font-size:13px;font-weight:600}form{display:grid;gap:10px}.field{display:grid;gap:6px}table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:12px}th,td{padding:13px;text-align:left;border:1px solid #e4e5e9}th{background:var(--yellow)}tbody tr:nth-child(even){background:#f4f0ff}caption{padding:12px;font:600 19px Kanit}footer{margin:24px 2px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px}@media(max-width:600px){body{padding:17px 13px}.top{align-items:flex-start}.hero{padding:24px 20px}footer{flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="mark">✦</span><span>PHP_7030 · FLAT DESIGN</span></div><a class="back" href="index.html">← กลับ Lesson 2</a></header><section class="hero"><span class="tag">LESSON 02 · EXERCISE 3</span><h1>จองโต๊ะคาเฟ่</h1><p>กรอกข้อมูลเพื่อส่งคำขอจองโต๊ะ</p></section><section class="panel"><form id="bookingForm" action="#" method="post"><div class="field"><label for="name">ชื่อผู้จอง</label><input type="text" id="name" name="name" required></div><div class="field"><label for="phone">เบอร์โทร</label><input type="tel" id="phone" name="phone"></div><div class="field"><label for="date">วันที่</label><input type="date" id="date" name="date" required></div><div class="field"><label for="guests">จำนวนคน</label><input type="number" id="guests" name="guests" min="1" max="10"></div><div class="field"><label>โซนที่นั่ง</label><label><input style="width:auto" type="radio" id="zone_indoor" name="zone" value="ในร้าน"> ในร้าน</label><label><input style="width:auto" type="radio" id="zone_outdoor" name="zone" value="ริมน้ำ"> ริมน้ำ</label></div><div class="field"><label for="time">รอบเวลา</label><select id="time" name="time"><option value="เช้า">เช้า</option><option value="กลางวัน">กลางวัน</option><option value="เย็น">เย็น</option></select></div><label><input style="width:auto" type="checkbox" id="birthday" name="birthday" value="ใช่"> มาฉลองวันเกิด</label><div class="field"><label for="note">หมายเหตุ</label><textarea id="note" name="note" rows="3"></textarea></div><button type="submit">ยืนยันการจอง →</button></form></section><script>document.getElementById("bookingForm").addEventListener("submit",function(event){event.preventDefault();alert("จองสำเร็จแล้ว! ขอบคุณที่ใช้บริการ");});</script><footer><span>PHP_7030 · Lesson 2 · แบบฝึกหัด 3</span><span>Learn · Practice · Build Better</span></footer></main></body></html>
